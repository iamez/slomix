name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # A merge queue tests each PR against the FUTURE state of main, and it does
  # that by pushing to a temporary merge_group ref. Without this trigger the
  # queue would enqueue a PR and then wait forever for checks that never run.
  merge_group:

permissions:
  contents: read

jobs:
  python:
    name: Python Lint + Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Both edges of pyproject.toml's requires-python = ">=3.11,<3.14".
    #
    # CI tested only 3.11 while the dev box and production both run 3.13, so the
    # one interpreter nobody actually uses was the only one gated. That gap is
    # not theoretical: `audioop` left the stdlib in 3.13 and `import discord`
    # pulls it, which 3.11 CI could never have caught. Two prior audits asked
    # for this matrix.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:14.15-alpine
        env:
          POSTGRES_USER: etlegacy_user
          POSTGRES_PASSWORD: etlegacy_test_password
          POSTGRES_DB: etlegacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etlegacy_user -d etlegacy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the whitespace gate below diffs against the PR base /
          # pre-push SHA, which a shallow checkout does not contain (IMP-009).
          fetch-depth: 0

      - name: Whitespace hygiene (git diff --check)
        # IMP-009: reject trailing whitespace / stray CR introduced by this
        # change set (pre-existing issues on untouched lines don't fail —
        # diff --check only inspects added lines). Base SHA differs by event:
        # PR → the PR base; push → the pre-push SHA (guarded: a forced push or
        # branch creation can yield an unknown/zero SHA → skip with a note).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base SHA ('$BASE') — skipping whitespace gate."
            exit 0
          fi
          # Markdown is excluded: a trailing double-space is VALID Markdown
          # (hard line break), so gating .md would forbid legitimate syntax.
          git diff --check "$BASE"...HEAD -- . ':(exclude)*.md'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check bot/ website/backend/

      - name: Dependency consistency (pip check)
        # Catches incompatible transitive pins (e.g. a fastapi/starlette bump
        # that leaves an unsatisfiable requirement) before they reach a deploy.
        run: pip check

      - name: Commands doc freshness (regen_commands_doc)
        # docs/COMMANDS.md is auto-generated by scripts/regen_commands_doc.py,
        # but nothing ever ran the script — the doc sat three months stale
        # (FIX 11, docs/research/FIX_ME_2026-08-11.md). Regenerate and fail on
        # any diff so a command add/rename/remove cannot ship without the doc.
        # One matrix leg is enough: the script is stdlib-only and its output is
        # sorted/deterministic, so both legs would produce identical bytes.
        if: matrix.python-version == '3.11'
        run: |
          python scripts/regen_commands_doc.py
          if ! git diff --exit-code -- docs/COMMANDS.md; then
            echo "::error file=docs/COMMANDS.md::docs/COMMANDS.md is stale — run 'python scripts/regen_commands_doc.py' and commit the result."
            exit 1
          fi

      - name: Install Lua (for the Lua-behaviour unit tests)
        # tests/unit/test_lua_gametimes_path.py runs the shipped Lua function
        # against stubbed engine cvars. Without an interpreter here it does not
        # fail — it SKIPS, which is worse: the guard looks green while checking
        # nothing, and the cross-instance path bug it exists for could come
        # back through a required check (Codex review, #788).
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run tests
        env:
          POSTGRES_TEST_HOST: localhost
          POSTGRES_TEST_PORT: 5432
          POSTGRES_TEST_DATABASE: etlegacy_test
          POSTGRES_TEST_USER: etlegacy_user
          POSTGRES_TEST_PASSWORD: etlegacy_test_password
          CACHE_BACKEND: memory
          PROMETHEUS_ENABLED: "false"
          SESSION_SECRET: ci-test-secret-not-for-production
          INTERNAL_API_SECRET: ci-test-secret-not-for-production
        run: pytest tests/ -v --tb=short --cov=bot --cov=website/backend --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673  # v4.5.0 — bump to v5+ requires `file:` → `files:` rename
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # No Codecov token configured; don't block CI

  javascript:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # react-router 8 declares engines.node >=22.22.0 — track latest 22.x
          node-version: "22.x"
          cache: "npm"
      - name: Install frontend tooling
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Route lists agree with the legacy registry
        # The guard that caught "29 routes audited, 32 in the registry, 36 in
        # the app table" lived inside audit_website_browser.mjs, which imports
        # Playwright — so it could only run where a browser was installed, i.e.
        # when somebody remembered. That is the same condition under which the
        # original gap survived unnoticed (brother's review on #839). This
        # runner needs Node and two files.
        run: node scripts/check_route_coverage.mjs

  react-frontend:
    name: React Typecheck + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # react-router 8 declares engines.node >=22.22.0 — track latest 22.x
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: website/frontend/package-lock.json
      - name: Install React frontend dependencies
        run: npm ci
      - name: Generate API types from the committed openapi snapshot
        # ⛔ THIS MUST RUN BEFORE tsc. `src/api/generated/openapi.d.ts` is NOT
        # tracked (2026-08-29): it is derived from docs/api/openapi.json, it
        # grows with every typed endpoint, and it crossed the 500 kB size
        # guard enforced by scripts/git-hooks/pre-push and this workflow.
        #
        # The guarantee is unchanged in substance and stronger in order. It
        # used to be "the committed .d.ts still matches the JSON", checked
        # AFTER tsc had already compiled against that committed file — so a
        # stale file could typecheck and only then be caught. Now the file is
        # built from the JSON first and tsc compiles against nothing else, and
        # tests/integration/test_openapi_snapshot.py ties the JSON to the
        # running app. App -> JSON -> types -> tsc, with no copy in between
        # that can drift (original intent: Codex review on #802).
        run: npm run generate:api
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Standalone app build (vite.app.config.ts)
        # tsc validates neither app.html nor the app Vite/Tailwind config nor
        # the emitted /app/assets layout the backend mounts — only the build
        # itself does (Codex on #802).
        run: |
          npm run build:app
          test -f ../static/app/app.html
          ls ../static/app/assets/*.js >/dev/null

  shellcheck:
    name: ShellCheck (deploy + ops scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: ShellCheck all tracked shell scripts
        # Gate EVERY tracked shell script at error severity (AUD-012), not just
        # scripts/*.sh: install.sh, slomix_vm_setup.sh, website/start_website.sh,
        # tools/*.sh and the sourced scripts/release_configs/*.sh are all part of
        # the production bootstrap/release surface, so a quoting/`cd` slip there
        # is just as real a hazard (Copilot/Codex review on #514). Enumerating via
        # `git ls-files '*.sh'` means new scripts are covered automatically and
        # the list can't drift. Style warnings (SC2006 etc.) are not gated yet —
        # ratchet to -S warning once the existing style debt is cleared.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          mapfile -t sh_files < <(git ls-files '*.sh')
          printf 'ShellCheck: %d tracked shell script(s)\n' "${#sh_files[@]}"
          shellcheck -S error "${sh_files[@]}"

  lua:
    name: Lua 5.4 (parse + runtime-semantics smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: luac5.4 parse gate for every tracked .lua
        # The game server runs Lua 5.4 since ET:Legacy 2.84.0. CI had ZERO Lua
        # steps while a runtime crash lived in production for three months
        # (RCA 2026-08-17) — this gate at least guarantees every tracked
        # script PARSES under the exact runtime major that executes it.
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4
          mapfile -t lua_files < <(git ls-files '*.lua')
          printf 'luac5.4 -p: %d tracked lua file(s)\n' "${#lua_files[@]}"
          for f in "${lua_files[@]}"; do luac5.4 -p "$f"; done
      - name: Frame-health watcher harness (real tracker, stubbed et API)
        # Drives proximity_tracker.lua's et_RunFrame through the four
        # behaviours the watcher exists for -- including the P0 pairing pin
        # (a slow tracker frame must be attributed to self, not the host)
        # and the self=-1 aborted-body sentinel. Mutations of the pairing
        # and of the end-of-frame self write were both watched failing
        # before this landed (2026-09-02).
        run: lua5.4 tests/lua/frame_health_harness.lua
      - name: Frame-health block harness (the five other modules)
        # v6.13: the same FH block is copied into every module with an
        # et_RunFrame hook (no `require` across VMs). Each module is loaded
        # in a fresh environment and must write its INIT line, stay quiet
        # on cheap frames, name itself on a slow one, hold the 1 s throttle
        # and re-raise a body error after measuring it.
        run: lua5.4 tests/lua/frame_health_modules_harness.lua
      - name: dots_arena 1v1 harness (the fair-duel module)
        # Seven decisions the module has to get right, checked against a
        # stubbed engine: the spawn shield is cleared BEFORE G_Damage (without
        # that the damage is a no-op -- G_Damage returns on PW_INVULNERABLE at
        # g_combat.c:1593, twenty-two lines before it reads dflags), the two
        # shields level to the EARLIER expiry, the test command takes only its
        # own console command, and the module stands down on any other map.
        # All three of those were watched failing as mutations (2026-09-04).
        run: lua5.4 tests/lua/dots_arena_1v1_harness.lua
      - name: Lua 5.4 semantics smoke (the classes that actually bit us)
        # Parsing cannot see a runtime %d-on-float; this pins the SEMANTICS the
        # fixes rely on, in the real interpreter: %d throws on non-integral
        # floats (so the guard-test grep discipline stays honest), the
        # conditional trunc matches LuaJIT truncation on both signs, round()
        # yields an integral float %d accepts, and 2^b is float-typed (why the
        # bit-shim wraps in math.floor).
        run: |
          lua5.4 - <<'LUA'
          assert(not pcall(string.format, "%d", 1234.5),
                 "%d must throw on a non-integral float")
          assert(select(2, pcall(string.format, "%d", 1234.5))
                 :match("no integer representation"))
          local function trunc(v) return v >= 0 and math.floor(v) or math.ceil(v) end
          assert(trunc(2.7) == 2 and trunc(-2.7) == -2, "trunc toward zero")
          local function round(x) return math.floor(x + 0.5) end
          assert(pcall(string.format, "%d", round(2.5)),
                 "%d must accept an integral float")
          assert(math.type(2 ^ 3) == "float", "2^b is float in 5.4")
          assert(math.type(math.floor(1 * (2 ^ 3))) == "integer",
                 "the bit-shim wrap restores the integer subtype")
          print("lua 5.4 semantics smoke: OK")
          LUA

  security:
    name: Security (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.0 bandit==1.9.4

      - name: Dependency audit (pip-audit)
        # NO IGNORES. Every advisory is gated, in both manifests.
        #
        # This block previously carried six time-boxed, owner-accepted ignores
        # (audit AUD-009): the starlette 0.x stack, held because
        # prometheus-fastapi-instrumentator 7.x constrained starlette<1.0, plus
        # paramiko, held pending an upstream fix. Both exit conditions are now
        # met — instrumentator 8.x requires starlette>=1.0 and paramiko 5.0.0
        # ships the fix — so the debt is paid rather than re-deferred, and the
        # audit runs clean with nothing suppressed.
        #
        # Keep it that way: an ignore added here is a promise to come back.
        # Prefer bumping the pin.
        run: |
          pip-audit -r requirements.txt --progress-spinner=off
          # The website venv is built from its own manifest (rsync_deploy_vm.sh,
          # slomix_vm_setup.sh) — audit it too so the web app can't lag on a
          # vulnerable pin.
          pip-audit -r website/requirements.txt --progress-spinner=off

      - name: Website dependency consistency (isolated pip check)
        # The web service deploys from website/requirements.txt into its OWN venv
        # (rsync_deploy_vm.sh / slomix_vm_setup.sh), so an incompatible pin there
        # slips past the root `pip check` in the python job, which resolves the
        # dev/root manifests. Install the web manifest into a throwaway venv and
        # check it in isolation so the deployed web venv can't be left broken
        # (Codex review on #514).
        run: |
          python -m venv /tmp/webvenv
          /tmp/webvenv/bin/pip install --upgrade pip
          /tmp/webvenv/bin/pip install -r website/requirements.txt
          /tmp/webvenv/bin/pip check

      - name: Static security scan (bandit)
        # Config in pyproject.toml [tool.bandit]: -ll = medium+ severity. B608 is a
        # documented SQL false-positive class (whitelisted identifiers, parameterized
        # values); intentional B601/B104 sites carry targeted `# nosec`. Targets cover
        # every runtime Python package (bot, website backend, the shared package
        # imported by the backend, proximity parser, greatshot, the deployed
        # vps_scripts watcher, the root DB manager); tests/tools/scripts/migrations
        # are excluded via pyproject [tool.bandit].
        run: bandit -c pyproject.toml -r bot website/backend shared proximity greatshot vps_scripts postgresql_database_manager.py -ll

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python, javascript]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build Docker images
        run: |
          cp website/.env.example .env 2>/dev/null || cp .env.example .env 2>/dev/null || true
          echo "POSTGRES_PASSWORD=ci_placeholder" >> .env
          echo "SESSION_SECRET=ci_placeholder" >> .env
          echo "INTERNAL_API_SECRET=ci_placeholder" >> .env
          echo "DISCORD_BOT_TOKEN=ci_placeholder" >> .env
          docker compose build api website
      - name: Validate Prometheus config + alert rules (promtool)
        # Same image tag docker-compose runs in production, so "promtool
        # accepts it" here means "prometheus will load it" there (IMP-005).
        run: |
          docker run --rm -v "$PWD/monitoring":/m:ro --entrypoint /bin/promtool \
            prom/prometheus:v2.54.1 check rules /m/alerts.yml
          docker run --rm -v "$PWD/monitoring":/m:ro --entrypoint /bin/promtool \
            prom/prometheus:v2.54.1 check config /m/prometheus.yml
