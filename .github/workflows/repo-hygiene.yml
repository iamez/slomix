name: Repo Hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:          # required for the merge queue -- see tests.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Lint with ruff
        run: ruff check bot/ website/backend/ --select E,F,W --ignore E501,E402,W291,W293,F401,F841

  file-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # 1 MB, matching scripts/git-hooks/pre-push and .pre-commit-config.
      # ⛔ THE FOURTH COPY OF THIS NUMBER. Raising the other three and leaving
      # this one would have moved the failure from the push to CI without
      # changing anything else — the guard's own comment named CI and
      # pre-commit but not this workflow.
      - name: Check for large files (>1MB)
        run: |
          large_files=$(find . -type f -size +1024k -not -path './.git/*' -not -path './local_stats/*' -not -path './node_modules/*' -not -path './.venv/*' -not -path './website/data/uploads/*' -not -path './website/assets/*')
          if [ -n "$large_files" ]; then
            echo "::error::Large files detected (>1MB):"
            echo "$large_files"
            exit 1
          fi
      - name: Check for merge conflict markers
        run: |
          if grep -rn '<<<<<<< ' --include='*.py' --include='*.js' --include='*.html' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.json' . 2>/dev/null | grep -v '.git/'; then
            echo "::error::Merge conflict markers found!"
            exit 1
          fi
      - name: Check for secrets patterns
        run: |
          if grep -rn 'PGPASSWORD=\|etlegacy_secure\|password.*=.*[a-zA-Z0-9_]\{8,\}' --include='*.py' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' . 2>/dev/null | grep -v '.git/' | grep -v '.env.example' | grep -v 'REDACTED' | grep -v 'test' | grep -v 'TODO'; then
            echo "::warning::Possible hardcoded secrets detected. Please review."
          fi
