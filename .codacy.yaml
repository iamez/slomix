exclude_paths:
  - "bot/schema.sql"
  - "schema.sql"
  - "tools/schema_postgresql.sql"
  - "website/migrations/005_date_based_availability.sql"
  - "website/js/utils.js"
  # Archive directories contain intentionally deprecated scripts (reference copies only)
  - "scripts/archive/**"
  - "tools/archive/**"
  # Test fixtures and migration SQL files
  - "tests/fixtures/**"
  - "website/migrations/**"
  - "migrations/**"
  # PostgreSQL-dialect psql scripts — Codacy runs TSQLLint (T-SQL) on *.sql,
  # which false-positives on PG syntax (same reason migrations are excluded)
  - "scripts/backtest_*.sql"
  # Minified build output — generated by Vite, not hand-written code
  - "website/static/modern/chunks/**"
  - "website/static/modern/route-host.js"
  # Test files — style issues in tests are not production concerns
  - "tests/**"
  # Rules-as-data audit tool: its whole design is executing SQL assembled
  # from the hardcoded RULES table (validated at import, structural tests in
  # tests/unit/test_data_plausibility_audit.py), on a connection opened
  # READ-ONLY, with no user input anywhere. Codacy's Opengrep pass flags
  # every such execute as SQL injection and — like the bandit engine
  # documented below — honours no inline suppression (# nosemgrep is
  # ignored), so the only lever is a path exclusion. Coverage is not lost:
  # ruff, bandit and the unit tests all run against this file in CI.
  - "scripts/data_plausibility_audit.py"
  # Documentation and non-code assets
  - "docs/**"
  # (website/requirements.txt used to be excluded here: Codacy's trivy pass has
  # no per-advisory ignore mechanism, so it re-reported the time-boxed
  # starlette 0.x debt on every PR touching the file. That debt is paid — the
  # starlette 1.x migration landed and the CI pip-audit now runs with no
  # ignores at all — so the exclusion is removed and the file is Codacy-covered
  # again, like the root manifest.)

engines:
  bandit:
    exclude_paths:
      # These two files chmod shared log files to 0o660 and the log directory
      # to 0o770 ON PURPOSE: the bot and web services run as different users in
      # the private `slomix` group and append to the same files, and 0640 left
      # the non-owning service read-only — which crash-looped the bot twice
      # (2026-07-13, 2026-07-22; one incident ran to 26,829 restarts).
      #
      # Bandit's own B103 is answered inline with `# nosec B103` on every such
      # line, and bandit HONOURS that: the repo's own gate
      # (`bandit -c pyproject.toml -r bot website/backend ... -ll`, the
      # "Security (pip-audit + bandit)" job in tests.yml) passes on these exact
      # files. Codacy's duplicate bandit pass ignores `# nosec` and has no
      # per-issue ignore mechanism in the configuration file — suppression
      # there is UI-only — so it re-reports the same four accepted findings on
      # every PR that touches these files.
      #
      # Scoped to the `bandit` engine and to these two paths ONLY. Every other
      # Codacy engine still analyses both files, and bandit still analyses the
      # rest of the repository, so nothing loses coverage: the identical tool
      # and rule set already runs against them in CI. Same reasoning as the
      # `website/requirements.txt` trivy exclusion above.
      #
      # Owner: iamez. Drops when bot and web stop sharing log files, at which
      # point the GroupWritableRotatingFileHandler goes away too.
      - "bot/logging_config.py"
      - "website/backend/logging_config.py"
      #
      # W5b measurement provenance. This file shells out to `git` seven times —
      # rev-parse, ls-files, status — to prove that a measurement ran from a
      # clean tree and to hash the untracked files that could otherwise change
      # a result without changing a commit. Provenance is the whole point of
      # the module: without it an S5 number is a claim, not evidence.
      #
      # The 15 findings are B404 (importing subprocess at all), B603
      # (subprocess without shell=True) and B607 (partial executable path).
      # Every call passes a hardcoded argument LIST with no shell and no user
      # input; `git` resolves through PATH deliberately, so the measurement
      # uses the same git the developer's own commands do.
      #
      # All 15 are Low severity, and the repo's own gate agrees: bandit run the
      # way CI runs it (`bandit -c pyproject.toml -r website/backend ... -ll`,
      # the "Security (pip-audit + bandit)" job) reports 0 issues at medium and
      # above and exits 0 on this file. Codacy's duplicate bandit pass counts
      # Low as well and honours no inline `# nosec`, so it re-reports the same
      # 15 accepted findings on every PR that touches the file.
      #
      # Scoped to the `bandit` engine and this one path. Every other Codacy
      # engine still analyses it, and bandit still analyses the rest of the
      # repository — the identical tool and rule set already runs against this
      # file in CI. Same reasoning as the two entries above.
      #
      # Owner: iamez. Drops if the provenance helpers stop using subprocess
      # (e.g. by reading .git directly), which would remove the findings at
      # the root rather than silencing them.
      - "website/backend/map_geometry/stage_measurement.py"
