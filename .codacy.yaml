exclude_paths:
  - "bot/schema.sql"
  - "schema.sql"
  - "tools/schema_postgresql.sql"
  - "website/migrations/005_date_based_availability.sql"
  - "website/js/utils.js"
  # Archive directories contain intentionally deprecated scripts (reference copies only)
  - "scripts/archive/**"
  - "tools/archive/**"
  # Test fixtures and migration SQL files
  - "tests/fixtures/**"
  - "website/migrations/**"
  - "migrations/**"
  # PostgreSQL-dialect psql scripts — Codacy runs TSQLLint (T-SQL) on *.sql,
  # which false-positives on PG syntax (same reason migrations are excluded)
  - "scripts/backtest_*.sql"
  # Minified build output — generated by Vite, not hand-written code
  - "website/static/modern/chunks/**"
  - "website/static/modern/route-host.js"
  # Test files — style issues in tests are not production concerns
  - "tests/**"
  # Documentation and non-code assets
  - "docs/**"
  # Dependency advisories for the web manifest are enforced by the CI
  # pip-audit step (tests.yml security job) with TIME-BOXED, owner-accepted
  # ignores for the starlette 0.x line (drops with the 1.x migration).
  # Codacy's trivy pass has no per-advisory ignore mechanism, so it would
  # permanently re-report that same accepted debt on every PR touching the
  # file. The root requirements.txt stays Codacy-covered.
  - "website/requirements.txt"

engines:
  bandit:
    exclude_paths:
      # These two files chmod shared log files to 0o660 and the log directory
      # to 0o770 ON PURPOSE: the bot and web services run as different users in
      # the private `slomix` group and append to the same files, and 0640 left
      # the non-owning service read-only — which crash-looped the bot twice
      # (2026-07-13, 2026-07-22; one incident ran to 26,829 restarts).
      #
      # Bandit's own B103 is answered inline with `# nosec B103` on every such
      # line, and bandit HONOURS that: the repo's own gate
      # (`bandit -c pyproject.toml -r bot website/backend ... -ll`, the
      # "Security (pip-audit + bandit)" job in tests.yml) passes on these exact
      # files. Codacy's duplicate bandit pass ignores `# nosec` and has no
      # per-issue ignore mechanism in the configuration file — suppression
      # there is UI-only — so it re-reports the same four accepted findings on
      # every PR that touches these files.
      #
      # Scoped to the `bandit` engine and to these two paths ONLY. Every other
      # Codacy engine still analyses both files, and bandit still analyses the
      # rest of the repository, so nothing loses coverage: the identical tool
      # and rule set already runs against them in CI. Same reasoning as the
      # `website/requirements.txt` trivy exclusion above.
      #
      # Owner: iamez. Drops when bot and web stop sharing log files, at which
      # point the GroupWritableRotatingFileHandler goes away too.
      - "bot/logging_config.py"
      - "website/backend/logging_config.py"
